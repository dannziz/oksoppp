ОБЩИЕ СВЕДЕНИЯ:
ОКСОП (Объединенный Корпус Сил Охраны Приметра) является единственным официальным государственным представительством в Чернобыльской Аномальной Зоне (ЧАЗ). Корпус сформирован под эгидой Совета Безопасности для выполнения критически важных задач по удержанию границ Зоны и обеспечению безопасности стратегических научных исследований.

СТРУКТУРА КОРПУСА:
- Группа Спецназначения "Альфа": Глубинная разведка, ликвидация особо опасных целей и поиск артефактов категории "Альфа".
- Гарнизон Периметра: Тотальный контроль всех входов и выходов из ЧАЗ, патрулирование буферных зон.
- Служба Безопасности НИИ: Охрана ученых, сопровождение экспедиций и пресечение утечек секретной информации.
- Отдел Технического Обеспечения: Поддержание работоспособности систем РЛС, ПВО и автономных охранных комплексов.

ВООРУЖЕНИЕ И ЭКИПИРОВКА:
На вооружении Корпуса стоят самые современные образцы вооружения: автоматы серии АК-12, АС "Вал", снайперские винтовки СВДМ и ОСВ-96. Для работы в аномальных полях используются бронекостюмы "Булат-3" и экспериментальные экзоскелеты "Монолит-Стоп", обеспечивающие надежную защиту от радиации и механических повреждений.

СТРАТЕГИЧЕСКИЕ ЦЕЛИ:
1. Абсолютная изоляция ЧАЗ: Пресечение любых попыток незаконного пересечения периметра.
2. Ресурсный Контроль: Изъятие и регистрация всех аномальных образований (артефактов).
3. Антитеррор: Ликвидация незаконных вооруженных формирований и бандподполья в глубине Зоны.
4. Научный Приоритет: Всемерная поддержка исследований НИИ ЧАЗ в интересах государственной безопасности.`},{id:"rules",title:"УСТАВ_HG",icon:"Book",content:`ОФИЦИАЛЬНЫЙ УСТАВ ВЗАИМОДЕЙСТВИЯ (HELLGATE STALKER RP)

I. ПРОТОКОЛ КОНТАКТА
- Любой субъект, обнаруженный патрулем, обязан нажать клавишу [C] (руки за голову) и оставаться на месте.
- Попытка бегства или использование оружия в присутствии военного — ликвидация на месте.

II. ЗОНА БЕЗОПАСНОСТИ
- Вокруг всех баз ОКСОП установлена бесполетная и закрытая зона радиусом 150 метров.
- Нахождение гражданских лиц в этой зоне без пропуска — огонь без предупреждения.

III. КОНТРОЛЬ СНАРЯЖЕНИЯ
- Категорически запрещено ношение армейской формы и спецсредств лицами, не состоящими в штате Корпуса.
- Запрещена фото- и видеофиксация лиц бойцов и офицеров (кроме репортеров с аккредитацией).

IV. КОНТРАБАНДА И АРТЕФАКТЫ
- Все найденные артефакты подлежат обязательной регистрации в НИИ.
- Скрытое хранение артефактов приравнивается к хищению госсобственности.

V. ОБЩИЕ ПРАВИЛА ПРОЕКТА
